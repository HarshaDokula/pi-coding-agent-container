services:
  pi-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Pinned pi version; set PI_VERSION in .env to upgrade.
        PI_VERSION: ${PI_VERSION:-1.4.0}
    image: local/pi-coding-agent:latest

    tty: true
    stdin_open: true

    environment:
      - HOME=/home/node
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - GIT_AUTHOR_NAME=${GIT_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_EMAIL}
      - GIT_CONFIG_COUNT=2
      - GIT_CONFIG_KEY_0=user.signingkey
      - GIT_CONFIG_VALUE_0=${GIT_GPG_KEY}
      - GIT_CONFIG_KEY_1=commit.gpgsign
      - GIT_CONFIG_VALUE_1=${GIT_GPG_SIGN:-false}

    secrets:
      - source: github_token
        target: ${SECRET_TARGET_PATH:-/run/secrets/gh_default}

    volumes:
      # Direct bind, intentionally NOT a named volume: the host path can change
      # between single- and multi-directory runs without docker compose seeing
      # a volume-config change and prompting to recreate the volume.
      - "${WORK_DIR:-${PWD}/workspace}:/workspace"
      - pi_data:/home/node/.pi
      - ${SSH_KEY}:/home/node/.ssh/git_key:ro
      
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    read_only: true

    # The agent runs as HOST_UID and needs no Linux capabilities; no-new-privileges
    # blocks setuid/file-capability escalation even if such a binary ever lands in
    # the image (the gh vault is no longer setuid — see SECURITY.md, C1).
    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp:noexec,nodev,nosuid,mode=1777
      - /home/node/.config:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid
      - /home/node/.npm:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000},mode=700,noexec,nodev,nosuid

    pids_limit: 150

    networks:
      - pi_network

    restart: "no"

volumes:
  pi_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PI_DATA_DIR:-${PWD}/.pi-data}

networks:
  pi_network:
    driver: bridge
    # Explicit small subnet: Docker's default allocator gives every network a
    # whole /16 from a pool of only ~15, which is exhausted after a dozen or so
    # per-project networks ("all predefined address pools have been fully
    # subnetted"). The Makefile/pictl derive a stable /24 per project; this
    # fallback covers a direct `docker compose` invocation.
    #
    # docker-compose.egress.yml overrides this network to `internal: true` when
    # the egress allowlist proxy is enabled (SECURITY.md, B5).
    ipam:
      config:
        - subnet: ${PI_NETWORK_SUBNET:-10.200.0.0/24}

secrets:
  github_token:
    file: ${PWD}/.secrets/github_token.txt
