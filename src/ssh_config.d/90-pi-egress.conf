# Route SSH through the egress allowlist proxy when one is configured.
#
# Installed as /etc/ssh/ssh_config.d/90-pi-egress.conf. The helper falls back to
# a direct connection when HTTPS_PROXY is unset, so this also works with
# EGRESS=false. %h/%p are expanded by ssh, not by a shell, which is why this
# belongs in ssh_config rather than in GIT_SSH_COMMAND (git splits that value on
# whitespace, which silently drops the ProxyCommand).
Host *
    ProxyCommand /usr/local/bin/ssh-netcat-proxy %h %p
